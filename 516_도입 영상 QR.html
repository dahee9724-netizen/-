<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6. 다각형의 둘레와 넓이 · 단원 도입 영상</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ea;--ink:#23324a;--card:#fff;--mint:#bfeacb;--pink:#ff7fa8;--blue:#3d6fdc;--sun:#ffd25e;--line:#d9cfb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2233;--ink:#f1ecdf;--card:#27314a;--mint:#2f6b4d;--line:#46516d}}
:root[data-theme="dark"]{--bg:#1b2233;--ink:#f1ecdf;--card:#27314a;--mint:#2f6b4d;--line:#46516d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:900px}
.stage{--ink:#23324a;--mint:#bfeacb;--line:#e8dfc8;color:#23324a;aspect-ratio:16/9;min-height:300px;background:#fffaf0;border-radius:22px;border:3px solid var(--line);overflow:hidden;padding:3%;text-align:center}
.split{display:flex;gap:4%;align-items:center;height:100%}
.m{flex:1;min-width:0}
.cw{flex:none;width:44%;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.cw.bo{width:auto;aspect-ratio:295/320}.cw.sm{width:36%}
.cut{width:100%;aspect-ratio:469/270;background:url(data:image/webp;base64,) center bottom/contain no-repeat;opacity:0;animation:in .9s forwards,bob 3.2s ease-in-out 1s infinite alternate}
.bo .cut{aspect-ratio:295/320;background-image:url(data:image/webp;base64,);flex:1;min-height:0;width:auto}
@keyframes bob{to{transform:translateY(-5px)}}
.bub{position:relative;background:#fff;border:2.5px solid #23324a;border-radius:18px;padding:8px 12px;margin:0 6% 14px;font-size:clamp(12px,2vw,18px);line-height:1.4;text-align:center;opacity:0;animation:in .7s .6s forwards}
.bub:after{content:"";position:absolute;bottom:-11px;left:var(--tx,30%);width:16px;height:16px;background:#fff;border:solid #23324a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) skew(10deg,10deg)}
.m h1{font-size:clamp(24px,4.6vw,46px);margin:0 0 .3em;font-weight:400}
.m h1 mark{background:linear-gradient(transparent 55%,var(--mint) 55%);color:inherit;padding:0 .15em}
.m p{font-size:clamp(15px,2.6vw,24px);margin:.3em 0}
.big{font-size:clamp(22px,4.4vw,44px)!important}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.frac i{font-style:normal;padding:0 .2em}.frac i:first-child{border-bottom:.08em solid currentColor}
.fade{opacity:0;animation:in .7s forwards}
@keyframes in{to{opacity:1}}
.line{position:relative;width:84%;height:64px;margin:26px auto 46px;border-bottom:4px solid var(--ink)}
.seg{position:absolute;bottom:4px;height:44px;border-radius:10px;background:var(--pink);border:3px solid #fff;color:#fff;font-size:clamp(11px,2vw,18px);display:flex;align-items:center;justify-content:center;transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.seg.on{transform:scaleY(1)}.seg:nth-child(even){background:var(--blue)}
.tick{position:absolute;bottom:-40px;transform:translateX(-50%);font-size:clamp(12px,2.1vw,19px)}
.tick:before{content:"";position:absolute;left:50%;top:-10px;height:12px;border-left:3px solid var(--ink)}
.count{min-height:1.6em;font-size:clamp(19px,3.6vw,34px);color:var(--blue)}
.chips{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{padding:8px 14px;border-radius:999px;background:var(--bg);border:3px solid var(--line);font-size:clamp(13px,2.1vw,20px)}
.chip.now{background:var(--mint);border-color:#7fcf98}
.cap{margin:14px 4px 10px;min-height:3em;font-size:clamp(17px,2.8vw,24px);text-align:center;line-height:1.5}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--pink)}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 18px;cursor:pointer}
button:hover{background:var(--mint)}button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
button[aria-pressed="true"]{background:var(--sun);color:#23324a}
@media (max-width:640px){.stage{aspect-ratio:auto;height:600px}.split{flex-direction:column;gap:10px}.cw,.cw.sm{width:100%;height:44%}.cw.bo{width:auto;height:40%}.line{margin-top:18px}}
@media (prefers-reduced-motion:reduce){.fade,.cut,.bub{animation:none;opacity:1}.seg{transition:none}}

.bub2:before{content:"";position:absolute;left:-12px;top:30px;width:16px;height:16px;background:#fff;border:solid #23324a;border-width:0 0 2.5px 2.5px;transform:rotate(45deg)}

const S=[
{d:6500,cap:'학교 정원에서 여러 모양의 화단과 잔디밭을 꾸미고 있어요. 선생님과 친구들이 정원을 살펴보고 있네요.',

{d:8500,cap:'학교 정원을 꾸미려면 정원의 테두리 길이와 넓이를 알아야 해요. 테두리 한 바퀴의 길이가 둘레이고, 안쪽 땅의 크기가 넓이예요.',
 h:()=>T2(`<div class="bub2">학교 정원을 꾸미려면<br>정원의 테두리 길이와<br>넓이를 알아야 해요.</div><div class="tags"><span class="tag fade" style="animation-delay:2.5s">테두리 한 바퀴 → 둘레</span><span class="tag fade" style="animation-delay:4s">안쪽 땅의 크기 → 넓이</span></div>`)},
{d:10500,cap:'잔디밭 둘레에 돌 울타리를 두르려고 해요. 가로 6미터, 세로 4미터인 잔디밭의 테두리를 한 바퀴 돌며 길이를 더해 볼까요? 6 더하기 4 더하기 6 더하기 4는 20미터예요.',
 h:()=>`<div class="split"><div class="m"><div class="img g"></div><h1 ${D(.6)} style="margin-top:14px">테두리 한 바퀴 = <mark>둘레</mark></h1></div><div class="m"><svg viewBox="0 0 320 240"><rect x="40" y="40" width="240" height="150" fill="#b8e6a8"/>${L(40,40,280,40,1)}${L(280,40,280,190,2.6)}${L(280,190,40,190,4.2)}${L(40,190,40,40,5.8)}${TX(160,26,'6 m',1.8)}${TX(304,120,'4 m',3.4)}${TX(160,222,'6 m',5)}${TX(20,120,'4 m',6.6)}</svg><p class="big fade" style="animation-delay:7.5s">6+4+6+4 = <mark>20 m</mark></p></div></div>`},
{d:11500,cap:'이번에는 잔디 매트를 깔아 볼까요? 한 변이 1미터인 정사각형 매트로 잔디밭 안쪽을 빈틈없이 채워요. 가로 6줄, 세로 4줄이니 모두 24장이 필요해요.',

 run(t){const c=[...document.querySelectorAll('.cell')],n=document.getElementById('cnt');c.forEach((e,i)=>t(()=>{e.classList.add('on');n.innerHTML=`${i+1}칸`+(i==23?' → <mark>24칸</mark>':'')},1200+i*280))}},
{d:8500,cap:'그런데 정원에는 삼각형, 평행사변형, 사다리꼴처럼 모양이 다른 화단도 있어요. 이번 단원에서 여러 가지 도형의 둘레와 넓이를 구하는 방법을 알아봐요.',
 h:()=>T2(`<h1 ${D(0)} style="text-align:center">6. <mark>다각형의 둘레와 넓이</mark></h1><svg viewBox="0 0 400 110" class="fade" style="animation-delay:1s"><rect x="10" y="30" width="80" height="50" fill="#7fcf6a"/><polygon points="120,80 150,30 220,30 190,80" fill="#ff9fb8"/><polygon points="250,80 290,25 330,80" fill="#ffd25e"/><polygon points="350,80 362,30 392,30 396,80" fill="#8fb4ff"/></svg><p class="fade" style="animation-delay:2.2s;text-align:center">모양이 달라도 둘레와 넓이를 구할 수 있을까요?</p>`)}
];
let i=0,playing=true,voice=false,timers=[];
const $=id=>document.getElementById(id),T=(f,ms)=>timers.push(setTimeout(f,ms));
function speak(x){if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}
function go(n){timers.forEach(clearTimeout);timers=[];i=(n+S.length)%S.length;const s=S[i];
 $('stage').innerHTML=s.h();$('cap').textContent=s.cap;
 if(s.on)T(()=>document.querySelectorAll('.seg').forEach(e=>e.classList.add('on')),1000);
 if(s.run)s.run(T);speak(s.cap);
 const p=$('prog');p.style.transition='none';p.style.width=(i/S.length*100)+'%';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition=`width ${s.d}ms linear`;p.style.width=((i+1)/S.length*100)+'%'}));
 if(playing)T(()=>{i<S.length-1?go(i+1):(playing=false,$('play').textContent='↻ 다시 보기',$('prog').style.transition='none')},s.d)}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
$('play').onclick=()=>{if($('play').textContent.includes('다시')){playing=true;$('play').textContent='⏸ 멈춤';go(0);return}
 playing=!playing;$('play').textContent=playing?'⏸ 멈춤':'▶ 재생';if(playing)go(i);else{timers.forEach(clearTimeout);timers=[];window.speechSynthesis&&speechSynthesis.cancel();const p=$('prog');p.style.width=getComputedStyle(p).width;p.style.transition='none'}}
$('voice').onclick=e=>{voice=!voice;e.target.setAttribute('aria-pressed',voice);e.target.textContent=voice?'🔇 소리 끄기':'🔊 소리 켜기';voice?speak(S[i].cap):window.speechSynthesis&&speechSynthesis.cancel()};
go(0);
</script>
