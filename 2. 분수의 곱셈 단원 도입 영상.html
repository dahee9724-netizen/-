.pic.b.r{background-position:right}
.pic.b.f{background-size:cover;aspect-ratio:487/350;height:auto;width:38%}
.m h1{font-size:clamp(24px,4.6vw,46px);margin:0 0 .3em;font-weight:400}
.m h1 mark{background:linear-gradient(transparent 55%,var(--mint) 55%);color:inherit;padding:0 .15em}
.m p{font-size:clamp(15px,2.6vw,24px);margin:.3em 0}
.big{font-size:clamp(22px,4.4vw,44px)!important}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.frac i{font-style:normal;padding:0 .2em}.frac i:first-child{border-bottom:.08em solid currentColor}
.fade{opacity:0;animation:in .7s forwards}
.pic.fade{animation:in .9s forwards,kb 12s ease-out forwards}
@keyframes in{to{opacity:1}}
.line{position:relative;width:84%;height:64px;margin:26px auto 46px;border-bottom:4px solid var(--ink)}
.seg{position:absolute;bottom:4px;height:44px;border-radius:10px;background:var(--pink);border:3px solid #fff;color:#fff;font-size:clamp(11px,2vw,18px);display:flex;align-items:center;justify-content:center;transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.seg.on{transform:scaleY(1)}.seg:nth-child(even){background:var(--blue)}
.tick{position:absolute;bottom:-40px;transform:translateX(-50%);font-size:clamp(12px,2.1vw,19px)}
.tick:before{content:"";position:absolute;left:50%;top:-10px;height:12px;border-left:3px solid var(--ink)}
.count{min-height:1.6em;font-size:clamp(19px,3.6vw,34px);color:var(--blue)}
.chips{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{padding:8px 14px;border-radius:999px;background:var(--bg);border:3px solid var(--line);font-size:clamp(13px,2.1vw,20px)}
.chip.now{background:var(--mint);border-color:#7fcf98}
.cap{margin:14px 4px 10px;min-height:3em;font-size:clamp(17px,2.8vw,24px);text-align:center;line-height:1.5}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--pink)}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 18px;cursor:pointer}
button:hover{background:var(--mint)}button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
button[aria-pressed="true"]{background:var(--sun);color:#23324a}
@media (max-width:640px){.stage{aspect-ratio:auto;height:560px}.split{flex-direction:column;gap:10px}.pic{height:46%}.pic.b.f{width:auto;height:30%}.line{margin-top:18px}}
@media (prefers-reduced-motion:reduce){.fade,.pic{animation:none;opacity:1}.seg{transition:none}}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="cap" id="cap"></div>
  <div class="bar"><b id="prog"></b></div>
  <div class="ctl">
    <button id="prev">◀ 이전</button>
    <button id="play">⏸ 멈춤</button>
    <button id="next">다음 ▶</button>
    <button id="voice" aria-pressed="false">🔊 소리 켜기</button>
  </div>
</main>
<script>
const F=(a,b)=>`<span class="frac"><i>${a}</i><i>${b}</i></span>`;
const D=(n,s)=>`class="fade" style="animation-delay:${n}s"`;
const P=(c,m)=>`<div class="split"><div class="pic ${c} fade"></div><div class="m">${m}</div></div>`;
const segs=(n,label)=>Array.from({length:n},(_,i)=>`<div class="seg" style="left:${i*100/6}%;width:${100/6}%">${label}</div>`).join('');
const S=[
{d:6500,cap:'우리 반 축제가 다가왔어요! 친구들과 함께 교실을 꾸미려고 리본 장식을 만들어요.',
 h:()=>P('a',`<h1 ${D(.5)}>🎉 <mark>우리 반 축제</mark></h1><p ${D(1.5)}>교실을 꾸밀 리본 장식을 만들어 볼까요?</p><p class="big" ${D(2.5)}>🎀 🎀 🎀 🎀 🎀</p>`)},
{d:7500,cap:'리본 한 개를 만드는 데 리본 끈이 3분의 1미터 필요해요. 3분의 1미터는 1미터를 똑같이 셋으로 나눈 것 중 하나예요.',
 h:()=>P('b l',`<h1 ${D(.3)}>리본 <mark>1개</mark> = ${F(1,3)} m</h1><div class="line" ${D(1)}><div class="seg" style="left:0;width:33.33%">${F(1,3)} m</div><span class="tick" style="left:0">0</span><span class="tick" style="left:33.33%">${F(1,3)}</span><span class="tick" style="left:66.66%">${F(2,3)}</span><span class="tick" style="left:100%">1 m</span></div><p ${D(2)}>1 m를 3칸으로 나눈 것 중 1칸</p>`),on:1},
{d:11000,cap:'그럼 리본 5개를 만들려면 끈이 모두 몇 미터 필요할까요? 3분의 1미터짜리를 하나, 둘, 셋, 넷, 다섯 번 이어 볼까요?',
 h:()=>P('b r',`<h1 ${D(.3)}>리본 <mark>5개</mark>에는 몇 m?</h1><div class="line" style="margin-bottom:56px"><div id="sg" style="position:absolute;inset:0">${segs(5,F(1,3))}</div><span class="tick" style="left:0">0</span><span class="tick" style="left:50%">1</span><span class="tick" style="left:100%">2 m</span></div><div class="count" id="count">&nbsp;</div>`),
 run(t){const s=[...document.querySelectorAll('#sg .seg')],c=document.getElementById('count');s.forEach((e,i)=>t(()=>{e.classList.add('on');c.innerHTML=`${i+1}개 → ${F(i+1,3)} m`},1000+i*1500));}},
{d:9000,cap:'3분의 1미터씩 5번 더하면 3분의 5미터, 대분수로는 1과 3분의 2미터예요. 리본 5개에는 끈이 1미터보다 더 필요해요.',
 h:()=>P('b f',`<p class="big" ${D(0)}>${F(1,3)}+${F(1,3)}+${F(1,3)}+${F(1,3)}+${F(1,3)}</p><p class="big" ${D(2.5)}>= ${F(5,3)}</p><p class="big" ${D(4.5)}>= 1${F(2,3)} m</p>`)},
{d:7500,cap:'리본이 더 많아지면 계속 더하기만 해야 할까요? 오늘부터 분수의 곱셈을 배워 더 쉽게 계산해 봐요.',
 h:()=>P('a',`<h1 ${D(0)}>2. <mark>분수의 곱셈</mark></h1><p ${D(1)}>리본이 10개, 20개가 되면?</p><p ${D(2.5)}>더 쉽게 계산하는 방법을 배워 봐요!</p>`)}
];
let i=0,playing=true,voice=false,timers=[];
const $=id=>document.getElementById(id),T=(f,ms)=>timers.push(setTimeout(f,ms));
function speak(x){if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}
function go(n){timers.forEach(clearTimeout);timers=[];i=(n+S.length)%S.length;const s=S[i];
 $('stage').innerHTML=s.h();$('cap').textContent=s.cap;
 if(s.on)T(()=>document.querySelectorAll('.seg').forEach(e=>e.classList.add('on')),1000);
 if(s.run)s.run(T);speak(s.cap);
 const p=$('prog');p.style.transition='none';p.style.width=(i/S.length*100)+'%';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition=`width ${s.d}ms linear`;p.style.width=((i+1)/S.length*100)+'%'}));
 if(playing)T(()=>{i<S.length-1?go(i+1):(playing=false,$('play').textContent='↻ 다시 보기',$('prog').style.transition='none')},s.d)}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
$('play').onclick=()=>{if($('play').textContent.includes('다시')){playing=true;$('play').textContent='⏸ 멈춤';go(0);return}
 playing=!playing;$('play').textContent=playing?'⏸ 멈춤':'▶ 재생';if(playing)go(i);else{timers.forEach(clearTimeout);timers=[];window.speechSynthesis&&speechSynthesis.cancel();const p=$('prog');p.style.width=getComputedStyle(p).width;p.style.transition='none'}}
$('voice').onclick=e=>{voice=!voice;e.target.setAttribute('aria-pressed',voice);e.target.textContent=voice?'🔇 소리 끄기':'🔊 소리 켜기';voice?speak(S[i].cap):window.speechSynthesis&&speechSynthesis.cancel()};
go(0);
</script>
</body>
</html>
